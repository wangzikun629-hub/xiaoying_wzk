[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "campaign-planner"
version = "0.1.0"
description = "Budget-aware content campaign planning with Deep Agents"
requires-python = ">=3.11"
dependencies = [
  "deepagents>=0.4,<0.8",
  "langchain-openai>=1.1,<2",
  "python-dotenv>=1,<2",
  "pyyaml>=6,<7",
]

[project.scripts]
campaign-planner = "campaign_planner.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/campaign_planner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
